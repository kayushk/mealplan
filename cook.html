<script>
var lang = 'hi';
var activeTab = 'today';

function toggleLang() {
  lang = lang === 'hi' ? 'en' : 'hi';
  document.getElementById('langBtn').textContent = lang === 'hi' ? 'English' : 'हिंदी';
  document.getElementById('tab-today').textContent = lang === 'hi' ? 'आज का' : 'Today';
  document.getElementById('tab-week').textContent = lang === 'hi' ? 'हफ्ते भर का' : 'Full Week';
  render();
}
function t(hi, en) { return lang === 'hi' ? hi : en; }

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('view-today').style.display = tab === 'today' ? '' : 'none';
  document.getElementById('view-week').style.display = tab === 'week' ? '' : 'none';
  document.getElementById('tab-today').classList.toggle('active', tab === 'today');
  document.getElementById('tab-week').classList.toggle('active', tab === 'week');
  if (tab === 'week') {
    var info = getCycleInfo(new Date());
    populateWeekDropdown(info.wIdx);
    renderWeekTab();
  } else {
    render();
  }
}

var CYCLE_START = new Date('2025-01-06T00:00:00');
function getCycleInfo(d) {
  var now = new Date(d); now.setHours(0,0,0,0);
  var diff = Math.floor((now - CYCLE_START) / 86400000);
  var total = ((diff % 28) + 28) % 28;
  var wIdx = Math.floor(total / 7);
  var dow = now.getDay();
  var dIdx = dow === 0 ? 6 : dow - 1;
  return { wIdx: wIdx, dIdx: dIdx, wNum: wIdx + 1 };
}

// Time windows for cook
// 5-10: juice + breakfast
// 10-16: lunch
// 16-23: dinner
function getState(hour) {
  if (hour < 5)  return { cur: null, nxt: 'breakfast', done: false, early: true };
  if (hour < 10) return { cur: 'breakfast', nxt: 'lunch', done: false, early: false };
  if (hour < 16) return { cur: 'lunch', nxt: 'dinner', done: false, early: false };
  if (hour < 23) return { cur: 'dinner', nxt: null, done: false, early: false };
  return { cur: null, nxt: null, done: true, early: false };
}

// ── HELPERS ─────────────────────────────────────────────────────────────────
function getTomorrowInfo(d) {
  var tom = new Date(d);
  tom.setDate(tom.getDate() + 1);
  return getCycleInfo(tom);
}

// ── RENDER ──────────────────────────────────────────────────────────────────
function mealCard(meal, mode) {
  var isMutton = meal.mutton;
  var nowBg = isMutton ? '#7A3500' : '#1A5276';
  var nameClass = mode === 'now' ? 'meal-name-now' : 'meal-name-next';

  var itemsHtml = meal.items.map(function(item) {
    return '<div class="item">' +
      '<div class="item-left">' +
        '<div class="item-name">' + t(item.hi, item.en) + '</div>' +
        (item.mhi || item.men ? '<div class="item-method">' + t(item.mhi, item.men) + '</div>' : '') +
      '</div>' +
      (item.qty ? '<div class="item-qty">' + item.qty + '</div>' : '') +
    '</div>';
  }).join('');

  var tagBar = mode === 'now'
    ? '<div class="meal-tag-bar-now' + (isMutton ? ' mutton' : '') + '" style="background:' + nowBg + '">' +
        '<div class="tag-label-now">' + t('अभी बनाएं', 'Cook Now') + '</div>' +
        '<div class="now-badge">' + t('अभी', 'NOW') + '</div>' +
      '</div>'
    : '<div class="meal-tag-bar-next">' +
        '<div class="next-dot"></div>' +
        '<div class="tag-label-next">' + t('अगला खाना', 'Coming Up Next') + '</div>' +
      '</div>';

  return '<div class="meal-block ' + mode + '">' +
    tagBar +
    '<div class="meal-body">' +
      '<div class="' + nameClass + '">' + t(meal.hi, meal.en) + '</div>' +
      '<div class="items">' + itemsHtml + '</div>' +
    '</div>' +
  '</div>';
}

function mealCardUpcoming(label, meal) {
  var itemsHtml = meal.items.map(function(item) {
    return '<div class="upcoming-item">' +
      '<span class="upcoming-item-name">' + t(item.hi, item.en) + '</span>' +
      (item.qty ? '<span class="upcoming-item-qty">' + item.qty + '</span>' : '') +
    '</div>';
  }).join('');
  return '<div class="upcoming-block">' +
    '<div class="upcoming-head"><span class="upcoming-tag">' + label + '</span></div>' +
    '<div class="upcoming-meal-name">' + t(meal.hi, meal.en) + '</div>' +
    '<div class="upcoming-items">' + itemsHtml + '</div>' +
  '</div>';
}

function renderWeekView(viewWIdx, currentWIdx, currentDIdx) {
  var DAY_HI  = ['सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार','रविवार'];
  var DAY_EN  = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var html = '';
  for (var d = 0; d < 7; d++) {
    var isToday = (viewWIdx === currentWIdx && d === currentDIdx);
    var bf = BF[d], ln = L[viewWIdx][d], dn = D[viewWIdx][d];
    html += '<div class="week-day' + (isToday ? ' week-today' : '') + '">' +
      '<div class="week-day-header">' +
        '<span class="week-day-name">' + t(DAY_HI[d], DAY_EN[d]) + '</span>' +
        (isToday ? '<span class="week-today-badge">' + t('आज','TODAY') + '</span>' : '') +
      '</div>' +
      '<div class="week-meals">' +
        '<div class="week-meal-row"><span class="week-meal-tag">Breakfast</span><span class="week-meal-text">' + t(bf.hi, bf.en) + '</span></div>' +
        '<div class="week-meal-row"><span class="week-meal-tag lunch">Lunch</span><span class="week-meal-text">' + t(ln.hi, ln.en) + (ln.mutton ? ' 🐑' : '') + '</span></div>' +
        '<div class="week-meal-row"><span class="week-meal-tag dinner">Dinner</span><span class="week-meal-text">' + t(dn.hi, dn.en) + '</span></div>' +
      '</div>' +
    '</div>';
  }
  return html;
}

function populateWeekDropdown(currentWIdx) {
  var sel = document.getElementById('weekSelect');
  if (!sel) return;
  sel.innerHTML = '';
  for (var w = 0; w < 4; w++) {
    var opt = document.createElement('option');
    opt.value = w;
    opt.textContent = t('हफ्ता ' + (w + 1) + (w === currentWIdx ? ' (यह हफ्ता)' : ''),
                        'Week ' + (w + 1) + (w === currentWIdx ? ' (This week)' : ''));
    if (w === currentWIdx) opt.selected = true;
    sel.appendChild(opt);
  }
}

function renderWeekTab() {
  var now = new Date();
  var info = getCycleInfo(now);
  var sel = document.getElementById('weekSelect');
  var viewWIdx = sel ? parseInt(sel.value) : info.wIdx;
  document.getElementById('weekMain').innerHTML = renderWeekView(viewWIdx, info.wIdx, info.dIdx);
}

  var hour = now.getHours() + now.getMinutes() / 60;

  var wIdx = info.wIdx, dIdx = info.dIdx, wNum = info.wNum;
  var state = getState(hour);

  // Header
  document.getElementById('hTitle').textContent = t('🍳 Aaj ka Khana', '🍳 Today\'s Meals');
  var dOpts = { weekday:'long', day:'numeric', month:'long' };
  document.getElementById('hDate').textContent = now.toLocaleDateString(lang === 'hi' ? 'hi-IN' : 'en-IN', dOpts);

  // Time bar
  document.getElementById('tLabel').textContent = t('Abhi ka waqt', 'Current time');
  document.getElementById('tNow').textContent = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true });
  document.getElementById('wInfo').textContent = t('Hafta ' + wNum + ' / 4', 'Week ' + wNum + ' of 4');

  // Juice card — show 5am to 10am
  var lunchData = L[wIdx][dIdx];
  var juiceHtml = (hour >= 5 && hour < 10)
    ? '<div class="juice-card"><div class="juice-icon">🥤</div><div>' +
        '<div class="juice-title">' + t('Sabzi ka Juice banana hai', 'Make Vegetable Juice') + '</div>' +
        '<div class="juice-detail">' + t(JUICE.hi, JUICE.en) + '</div>' +
      '</div></div>'
    : '';
  document.getElementById('juiceCard').innerHTML = juiceHtml;

  // Mutton alert
  var muttonHtml = lunchData.mutton
    ? '<div class="mutton-card"><div class="mutton-icon">🐑</div><div>' +
        '<div class="mutton-title">' + t('Aaj MUTTON banana hai!', 'MUTTON today!') + '</div>' +
        '<div class="mutton-detail">' + t('Poora masala — charbi ke saath — dheere pakao', 'Full masala — cook with fat — slow cook') + '</div>' +
      '</div></div>'
    : '';
  document.getElementById('muttonCard').innerHTML = muttonHtml;

  // Main content
  var html = '';

  if (state.done) {
    html = '<div class="done-card">' +
      '<div class="done-icon">✅</div>' +
      '<div class="done-title">' + t('Aaj ka kaam khatam!', 'Done for today!') + '</div>' +
      '<div class="done-sub">' + t('Kal subah 5 baje se phir shuru', 'See you tomorrow at 5am') + '</div>' +
    '</div>';
  } else if (state.early) {
    html = '<div class="soon-card">' +
      '<div class="soon-icon">🌙</div>' +
      '<div class="soon-title">' + t('Abhi kuch nahi', 'Nothing yet') + '</div>' +
      '<div class="soon-sub">' + t('Subah 5 baje se shuru karna', 'Start at 5am') + '</div>' +
    '</div>';
  } else {
    // Current meal
    var curMeal = null;
    if (state.cur === 'breakfast') curMeal = BF[dIdx];
    else if (state.cur === 'lunch') curMeal = L[wIdx][dIdx];
    else if (state.cur === 'dinner') curMeal = D[wIdx][dIdx];

    if (curMeal) html += mealCard(curMeal, 'now');

    // Next meal
    var nxtMeal = null;
    if (state.nxt === 'breakfast') nxtMeal = BF[dIdx];
    else if (state.nxt === 'lunch') nxtMeal = L[wIdx][dIdx];
    else if (state.nxt === 'dinner') nxtMeal = D[wIdx][dIdx];

    if (nxtMeal) html += mealCard(nxtMeal, 'next');
  }

  document.getElementById('main').innerHTML = html;

  // Upcoming section (2 meals ahead)
  var tom = getTomorrowInfo(now);
  var twIdx = tom.wIdx, tdIdx = tom.dIdx;
  var upHtml = '';
  if (!state.done && !state.early) {
    var upMeals = [];
    if (state.cur === 'breakfast') {
      upMeals.push({ label: t('आज रात', 'Tonight'), meal: D[wIdx][dIdx] });
      upMeals.push({ label: t('कल सुबह', 'Tomorrow Morning'), meal: BF[tdIdx] });
    } else if (state.cur === 'lunch') {
      upMeals.push({ label: t('कल सुबह', 'Tomorrow Morning'), meal: BF[tdIdx] });
      upMeals.push({ label: t('कल दोपहर', 'Tomorrow Lunch'), meal: L[twIdx][tdIdx] });
    } else if (state.cur === 'dinner') {
      upMeals.push({ label: t('कल सुबह', 'Tomorrow Morning'), meal: BF[tdIdx] });
      upMeals.push({ label: t('कल दोपहर', 'Tomorrow Lunch'), meal: L[twIdx][tdIdx] });
    }
    if (upMeals.length) {
      upHtml = '<div class="upcoming-section">' +
        '<div class="upcoming-label-bar">' + t('आगे का प्लान', 'Coming Up') + '</div>' +
        upMeals.map(function(u) { return mealCardUpcoming(u.label, u.meal); }).join('') +
      '</div>';
    }
  }
  document.getElementById('upcoming').innerHTML = upHtml;

}

render();
setInterval(render, 60000);
</script>
</body>
</html>
