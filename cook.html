let lang = 'hi';
function toggleLang() {
  lang = lang === 'hi' ? 'en' : 'hi';

  render();
}
function t(hi, en) { return lang === 'hi' ? hi : en; }

// ─── CYCLE ────────────────────────────────────────────────────────────────
const CYCLE_START = new Date('2025-01-06T00:00:00');
function getCycleInfo(date) {
  const d = new Date(date); d.setHours(0,0,0,0);
  const diffDays = Math.floor((d - CYCLE_START) / 86400000);
  const totalDays = ((diffDays % 28) + 28) % 28;
  const weekIdx = Math.floor(totalDays / 7);
  const dow = d.getDay();
  const dayIdx = dow === 0 ? 6 : dow - 1;
  return { weekIdx, dayIdx, weekNum: weekIdx + 1 };
}

// ─── TIME WINDOWS ─────────────────────────────────────────────────────────
// Cook's meals only: juice+breakfast, lunch, dinner
// No snacks, no jeera water, no isabgol, no haldi milk
const WINDOWS = [
  { id: 'juice',     start:  5, end: 10 },
  { id: 'breakfast', start:  5, end: 10 },
  { id: 'lunch',     start: 10, end: 16 },
  { id: 'dinner',    start: 16, end: 23 },
];

function getCurrentAndNext(hour) {
  // Find current window
  let currentIdx = -1;
  for (let i = 0; i < WINDOWS.length; i++) {
    if (hour >= WINDOWS[i].start && hour < WINDOWS[i].end) {
      currentIdx = i;
      break;
    }
  }

  // Before 5am — nothing yet, show first meal coming
  if (currentIdx === -1 && hour < 5) {
    return { current: null, next: WINDOWS[0].id, done: false };
  }

  // After 11pm — all done
  if (currentIdx === -1 && hour >= 23) {
    return { current: null, next: null, done: true };
  }

  // In a window
  if (currentIdx !== -1) {
    const nextId = currentIdx < WINDOWS.length - 1 ? WINDOWS[currentIdx + 1].id : null;
    return { current: WINDOWS[currentIdx].id, next: nextId, done: false };
  }

  // Between windows — show next upcoming
  for (let i = 0; i < WINDOWS.length; i++) {
    if (hour < WINDOWS[i].start) {
      return { current: null, next: WINDOWS[i].id, done: false };
    }
  }
  return { current: null, next: null, done: true };
}

// ─── RENDER ───────────────────────────────────────────────────────────────
function renderMealBlock(meal, mode) {
  // mode: 'now' or 'next'
  const isMutton = meal.mutton;
  const accentColor = mode === 'now' ? (isMutton ? '#7A3500' : '#1A5276') : '#888';
  const tagBarBg = mode === 'now' ? (isMutton ? '#F5A623' : '#1A5276') : '#F0F2F5';

  const nowLabel = t('अभी बनाएं', 'Cook Now');
  const nextLabel = t('अगला खाना', 'Coming Up Next');
  const nowBadge = t('अभी', 'NOW');

  let itemsHtml = meal.items.map(item => `
    <div class="item">
      <div class="item-left">
        <div class="item-name">${t(item.name_hi, item.name_en)}</div>
        <div class="item-method">${t(item.method_hi, item.method_en)}</div>
      </div>
      <div class="item-qty">${item.qty}</div>
    </div>
  `).join('');

  if (mode === 'now') {
    return `
    <div class="meal-block now">
      <div class="meal-tag-bar" style="background:${tagBarBg}">
        <div class="tag-label">${nowLabel}</div>
        <div class="now-badge">${nowBadge}</div>
      </div>
      <div class="meal-body">
        <div class="meal-name">${t(meal.name_hi, meal.name_en)}</div>
        <div class="items">${itemsHtml}</div>
      </div>
    </div>`;
  } else {
    return `
    <div class="meal-block next">
      <div class="meal-tag-bar">
        <div class="next-dot" style="background:${accentColor}"></div>
        <div class="tag-label" style="color:${accentColor}">${nextLabel}</div>
      </div>
      <div class="meal-body">
        <div class="meal-name">${t(meal.name_hi, meal.name_en)}</div>
        <div class="items">${itemsHtml}</div>
      </div>
    </div>`;
  }
}

function render() {
  const now = new Date();
  const hour = now.getHours() + now.getMinutes() / 60;
  const { weekIdx, dayIdx, weekNum } = getCycleInfo(now);

  // Header
  document.getElementById('headerTitle').textContent = t('🍳 Aaj ka Khana', '🍳 Today\'s Meals');
  const dateStr = now.toLocaleDateString('hi-IN', { weekday:'long', day:'numeric', month:'long' });
  const dateStrEn = now.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('headerDate').textContent = t(dateStr, dateStrEn);

  // Time
  const timeStr = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true });
  document.getElementById('timeNow').textContent = timeStr;
  document.getElementById('timeLabel').textContent = t('Abhi ka waqt', 'Current time');
  document.getElementById('weekInfo').textContent = t(`Hafta ${weekNum} / 4`, `Week ${weekNum} of 4`);

  // Juice card (show only in morning window 5-10am)
  const juiceHtml = (hour >= 5 && hour < 10) ? `
    <div class="juice-card">
      <div class="juice-icon">🥤</div>
      <div>
        <div class="juice-title">${t('Sabzi ka Juice banana hai', 'Make Vegetable Juice')}</div>
        <div class="juice-detail">${t('Adrak + Lauki + Chukandar + Gajar + Palak — cheeni ya namak nahi dalna', 'Ginger + Bottle Gourd + Beetroot + Carrot + Spinach — no sugar or salt')}</div>
      </div>
    </div>` : '';
  document.getElementById('juiceCard').innerHTML = juiceHtml;

  // Mutton alert
  const lunchData = LUNCH[weekIdx][dayIdx];
  const muttonHtml = lunchData.mutton ? `
    <div class="mutton-card">
      <div class="mutton-icon">🐑</div>
      <div>
        <div class="mutton-title">${t('Aaj MUTTON banana hai!', 'MUTTON today!')}</div>
        <div class="mutton-detail">${t('Poora masala · charbi ke saath · dheere pakao', 'Full masala · cook with fat · slow cook')}</div>
      </div>
    </div>` : '';
  document.getElementById('muttonCard').innerHTML = muttonHtml;

  // Figure out current + next cook meal
  const { current, next, done } = getCurrentAndNext(hour);

  // Map window id to meal data
  function getMealData(windowId) {
    if (windowId === 'juice') return null; // handled separately
    if (windowId === 'breakfast') return { ...BREAKFAST[dayIdx], isBreakfast: true };
    if (windowId === 'lunch') return LUNCH[weekIdx][dayIdx];
    if (windowId === 'dinner') return DINNER[weekIdx][dayIdx];
    return null;
  }

  let html = '';

  if (done) {
    html = `
      <div class="done-card">
        <div class="done-icon">✅</div>
        <div class="done-title">${t('Aaj ka kaam khatam!', 'Done for today!')}</div>
        <div class="done-sub">${t('Kal subah 5 baje se phir shuru', 'See you tomorrow at 5am')}</div>
      </div>`;
  } else if (!current && !next) {
    html = `
      <div class="done-card">
        <div class="done-icon">🌙</div>
        <div class="done-title">${t('Abhi kuch nahi banana', 'Nothing to cook right now')}</div>
        <div class="done-sub">${t('Subah 5 baje juice aur nashta banana shuru karna', 'Start juice and breakfast at 5am')}</div>
      </div>`;
  } else {
    // Show NOW meal
    if (current && current !== 'juice') {
      const currentMeal = getMealData(current);
      if (currentMeal) html += renderMealBlock(currentMeal, 'now');
    } else if (current === 'juice') {
      // Juice is shown in the juice card above, show breakfast as NOW too
      const breakfastMeal = getMealData('breakfast');
      if (breakfastMeal) html += renderMealBlock(breakfastMeal, 'now');
    }

    // Show NEXT meal
    if (next && next !== 'juice') {
      const nextMeal = getMealData(next);
      if (nextMeal) html += renderMealBlock(nextMeal, 'next');
    }
  }

  document.getElementById('mainContent').innerHTML = html;
}

// Auto-refresh every minute
render();
setInterval(render, 60000);
</script>
</body>
