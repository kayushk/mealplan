<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Meal Plan</title>
<style>
  :root {
    --mma:    #C0392B; --mmaL:   #FAECE7;
    --swim:   #1A5276; --swimL:  #EBF5FB;
    --sat:    #4A235A; --satL:   #F5EEF8;
    --sun:    #0F6E56; --sunL:   #E1F5EE;
    --green:  #1D9E75; --greenL: #E8F8F3;
    --amber:  #784212; --amberL: #FAEEDA;
    --purple: #3C3489; --purpleL:#EEEDFE;
    --red:    #922B21; --redL:   #FAECE7;
    --grey:   #444441; --greyL:  #F4F4F4;
    --white:  #FFFFFF;
    --text:   #1A1A1A;
    --subtext:#555555;
    --border: #E0E0E0;
    --bg:     #F7F8FA;
    --card:   #FFFFFF;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── HEADER ── */
  .header { background: var(--swim); color: #fff; padding: 18px 20px 14px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header-date { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .week-badge { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }

  /* ── DATE PICKER ── */
  .date-row { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .date-row label { font-size: 13px; font-weight: 600; color: var(--subtext); }
  .date-row input[type=date] { border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 14px; background: var(--bg); color: var(--text); cursor: pointer; }
  .date-row input[type=date]:focus { outline: none; border-color: var(--swim); }
  .today-btn { background: var(--swim); color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .today-btn:hover { opacity: 0.85; }

  /* ── MAIN ── */
  .container { max-width: 720px; margin: 0 auto; padding: 16px; }

  /* ── TRAINING TAG ── */
  .training-banner { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .training-banner .icon { font-size: 28px; }
  .training-banner .info h2 { font-size: 16px; font-weight: 700; }
  .training-banner .info p { font-size: 13px; margin-top: 2px; opacity: 0.8; }
  .training-banner .kcal { margin-left: auto; font-size: 13px; font-weight: 700; opacity: 0.8; white-space: nowrap; }

  /* ── MACRO BAR ── */
  .macro-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .macro-pill { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--subtext); }
  .macro-pill span { color: var(--text); }

  /* ── MEAL CARDS ── */
  .meals { display: flex; flex-direction: column; gap: 10px; }
  .meal-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .meal-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
  .meal-emoji { font-size: 20px; }
  .meal-time { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .meal-name-row { padding: 0 14px 10px; }
  .meal-dish { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
  .meal-detail { font-size: 13px; color: var(--subtext); line-height: 1.5; }
  .meal-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-top: 1px solid var(--border); background: var(--greyL); }
  .meal-proto { font-size: 13px; font-weight: 700; }
  .meal-method { font-size: 12px; color: var(--subtext); }
  .meal-snack-note { font-size: 11px; background: var(--redL); color: var(--red); font-weight: 600; padding: 2px 8px; border-radius: 10px; }

  /* ── ALERT CARDS ── */
  .alert { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; font-size: 13px; line-height: 1.5; display: flex; gap: 10px; align-items: flex-start; }
  .alert-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .alert-mutton { background: var(--amberL); color: var(--amber); border: 1px solid #F0C080; }
  .alert-reminder { background: var(--greenL); color: var(--sun); border: 1px solid #A0D9C0; }

  /* ── GUT ROUTINE ── */
  .gut-section { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 16px; overflow: hidden; }
  .gut-header { background: var(--sun); color: #fff; padding: 10px 14px; font-size: 14px; font-weight: 700; }
  .gut-list { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .gut-item { font-size: 13px; color: var(--subtext); display: flex; gap: 8px; }
  .gut-dot { color: var(--green); font-weight: 700; flex-shrink: 0; }

  /* ── WEEK NAV ── */
  .week-nav { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 16px; overflow: hidden; }
  .week-nav-header { background: var(--grey); color: #fff; padding: 10px 14px; font-size: 13px; font-weight: 700; }
  .week-days { display: grid; grid-template-columns: repeat(7, 1fr); }
  .week-day { padding: 8px 4px; text-align: center; cursor: pointer; border-right: 1px solid var(--border); font-size: 11px; }
  .week-day:last-child { border-right: none; }
  .week-day .wday { font-weight: 700; font-size: 10px; text-transform: uppercase; color: var(--subtext); }
  .week-day .wdate { font-size: 13px; font-weight: 700; margin-top: 2px; color: var(--text); }
  .week-day.active { background: var(--swim); }
  .week-day.active .wday, .week-day.active .wdate { color: #fff; }
  .week-day.today-mark .wdate { color: var(--mma); }

  /* ── FOOTER ── */
  .footer { text-align: center; padding: 20px; font-size: 12px; color: #aaa; }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    .container { padding: 10px; }
    .meal-dish { font-size: 15px; }
    .header h1 { font-size: 16px; }
  }

  /* ── LANG TOGGLE ── */
  .lang-toggle { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .lang-toggle:hover { background: rgba(255,255,255,0.25); }
</style>
</head>

// ─── CYCLE START DATE ─────────────────────────────────────────────────────────
// Set this to the Monday of the week you want to be Week 1
// Using today as default — you can change this to a fixed anchor date
const CYCLE_START = new Date('2025-01-06'); // Monday 6 Jan 2025 = Week 1 start

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function getWeekAndDay(date) {
  const d = new Date(date); d.setHours(0,0,0,0);
  const start = new Date(CYCLE_START); start.setHours(0,0,0,0);
  const diffMs = d - start;
  const diffDays = Math.floor(diffMs / 86400000);
  const totalDays = ((diffDays % 28) + 28) % 28; // handle dates before start
  const weekIdx = Math.floor(totalDays / 7);   // 0-3
  const dayOfWeek = d.getDay(); // 0=Sun,1=Mon...6=Sat
  const dayIdx = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // Mon=0..Sun=6
  return { weekIdx, dayIdx, weekNum: weekIdx + 1 };
}

function typeInfo(type) {
  const map = {
    mma:  { color:'var(--mma)',  bg:'var(--mmaL)',  icon:'🥊', label:'Gym + MMA', label_hi:'Gym + MMA', kcal:'~3000–3200 kcal', kcal_hi:'Sabse bhari training' },
    swim: { color:'var(--swim)', bg:'var(--swimL)', icon:'🏊', label:'Gym + Swimming', label_hi:'Gym + Swimming', kcal:'~2700–2900 kcal', kcal_hi:'Medium training' },
    sat:  { color:'var(--sat)',  bg:'var(--satL)',  icon:'🏋️', label:'Heavy Lift + Swim', label_hi:'Heavy Gym + Swimming', kcal:'~2800–3000 kcal', kcal_hi:'Heavy lifting din' },
    sun:  { color:'var(--sun)',  bg:'var(--sunL)',  icon:'🏄', label:'Swim Only — Recovery', label_hi:'Sirf Swimming — Aaram', kcal:'~2200–2400 kcal', kcal_hi:'Aaram ka din' },
  };
  return map[type] || map.swim;
}

function formatDate(d) {
  return d.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

function pad2(n) { return String(n).padStart(2,'0'); }
function dateToInput(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

// ─── RENDER ───────────────────────────────────────────────────────────────────
let currentDate = new Date();

function loadDay() {
  const picker = document.getElementById('datePicker');
  if (picker.value) {
    currentDate = new Date(picker.value + 'T00:00:00');
  }
  render();
}

function goToday() {
  currentDate = new Date();
  document.getElementById('datePicker').value = dateToInput(currentDate);
  render();
}

function render() {
  const { weekIdx, dayIdx, weekNum } = getWeekAndDay(currentDate);
  const dayData = plan[weekIdx][dayIdx];
  const ti = typeInfo(dayData.type);
  const isMutton = dayData.mutton;
  const hasMutton = plan[weekIdx].some(d => d.mutton);

}

function renderWeekNav(activeWeek, activeDay) {
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(currentDate); d.setHours(0,0,0,0);
  // Find Monday of current week
  const dow = d.getDay();
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(d); monday.setDate(d.getDate() + mondayOffset);

  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const days_hi = ['Som','Mang','Budh','Guru','Shukra','Shani','Ravi'];

  let html = `<div class="week-nav"><div class="week-nav-header">📅 ${t('This week — tap any day','Is hafte — koi bhi din dabao')}</div><div class="week-days">`;
  for (let i = 0; i < 7; i++) {
    const dayDate = new Date(monday); dayDate.setDate(monday.getDate() + i);
    const isActive = i === activeDay;
    const isToday = dayDate.getTime() === today.getTime();
    html += `<div class="week-day ${isActive ? 'active' : ''} ${isToday && !isActive ? 'today-mark' : ''}"
      onclick="jumpToDate('${dateToInput(dayDate)}')">
      <div class="wday">${t(days[i], days_hi[i])}</div>
      <div class="wdate">${dayDate.getDate()}</div>
    </div>`;
  }
  html += '</div></div>';
  document.getElementById('weekNav').innerHTML = html;
}

function jumpToDate(dateStr) {
  currentDate = new Date(dateStr + 'T00:00:00');
  document.getElementById('datePicker').value = dateStr;
  render();
}

// ─── INIT ────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const today = new Date();
  document.getElementById('datePicker').value = dateToInput(today);
  render();
});
</script>
