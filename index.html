<html lang="en">
<head>
<meta charset="UTF-8">

<title>Meal Plan</title>
<style>

    --mma:    #C0392B; --mmaL:   #FAECE7;

    --amber:  #784212; --amberL: #FAEEDA;

    --red:    #C0392B; --redL:   #FAECE7;
    --grey:   #444441; --greyL:  #F4F4F4;
    --white:  #FFFFFF;
    --text:   #1A1A1A;
    --subtext:#666666;
    --border: #E8E8E8;
    --bg:     #F5F6F8;
    --card:   #FFFFFF;
    --radius: 14px;
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--swim); color: #fff;
    padding: 16px 18px 14px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }
  .header-row1 { display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-size: 17px; font-weight: 700; }
  .lang-btn {
    background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.35);
    color: #fff; border-radius: 20px; padding: 4px 13px;
    font-size: 13px; font-weight: 700; cursor: pointer; letter-spacing: 0.02em;
  }
  .header-row2 { margin-top: 6px; display: flex; align-items: center; justify-content: space-between; }
  .header-date { font-size: 13px; opacity: 0.88; }
  .header-time { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .day-type-chip {
    margin-top: 8px; display: inline-flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,0.15); border-radius: 20px;
    padding: 5px 13px; font-size: 13px; font-weight: 600;
  }

  /* MAIN */
  .container { max-width: 520px; margin: 0 auto; padding: 14px 14px 30px; }

  /* WEEK + MUTTON ALERT */
  .top-info { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .info-chip {
    font-size: 12px; font-weight: 600; padding: 4px 11px;
    border-radius: 20px; display: inline-flex; align-items: center; gap: 5px;
  }
  .mutton-alert {
    background: var(--amberL); color: var(--amber);
    border-radius: var(--radius); padding: 11px 14px;
    font-size: 13px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 9px;
    border: 1px solid #F0C080;
  }

  /* MEAL CARDS */
  .meals { display: flex; flex-direction: column; gap: 8px; }

  .meal-card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
    transition: opacity 0.3s, transform 0.2s;
    position: relative;
  }

  /* CURRENT meal — highlighted */
  .meal-card.current {
    box-shadow: 0 4px 24px rgba(0,0,0,0.13);
    transform: scale(1.01);
  }
  .meal-card.current::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px;
    border-radius: 14px 0 0 14px;
  }

  /* PAST meal — dimmed */
  .meal-card.past {
    opacity: 0.42;
  }
  .meal-card.past .meal-dish { text-decoration: line-through; text-decoration-color: #aaa; }

  /* UPCOMING — normal */
  .meal-card.upcoming { opacity: 1; }

  /* SKIPPED — grey out entirely (snack on non-MMA days) */
  .meal-card.skipped { display: none; }

  .meal-inner { padding: 13px 15px 11px; }
  .meal-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .meal-emoji { font-size: 22px; line-height: 1; }
  .meal-time-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--subtext);
  }
  .current-badge {
    margin-left: auto; font-size: 10px; font-weight: 700;
    padding: 2px 9px; border-radius: 10px;
    display: none;
  }
  .meal-card.current .current-badge { display: inline-block; }

  .meal-dish { font-size: 15px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
  .meal-detail { font-size: 12px; color: var(--subtext); line-height: 1.5; }
  .meal-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 15px 9px; border-top: 1px solid var(--border);
    background: var(--greyL);
  }
  .meal-method { font-size: 11px; color: var(--subtext); }
  .meal-protein { font-size: 12px; font-weight: 700; }

  .gut-card {
    background: var(--card); border-radius: var(--radius);

  .gut-header { background: var(--sun); color: #fff; padding: 10px 15px; font-size: 13px; font-weight: 700; }

  .gut-item { font-size: 12px; color: var(--subtext); display: flex; gap: 8px; }
  .gut-dot { color: var(--green); font-weight: 700; flex-shrink: 0; }

  /* FOOTER */
  .footer { text-align: center; padding: 18px; font-size: 11px; color: #bbb; }

let lang = 'en';
function toggleLang() {
  lang = lang === 'en' ? 'hi' : 'en';

}
function t(en, hi) { return lang === 'hi' ? hi : en; }

// ─── CYCLE ────────────────────────────────────────────────────────────────
// Week 1 anchor: Monday 6 Jan 2025
const CYCLE_START = new Date('2025-01-06T00:00:00');

function getCycleInfo(date) {
  const d = new Date(date); d.setHours(0,0,0,0);
  const start = new Date(CYCLE_START);
  const diffDays = Math.floor((d - start) / 86400000);
  const totalDays = ((diffDays % 28) + 28) % 28;
  const weekIdx = Math.floor(totalDays / 7);
  const dow = d.getDay(); // 0=Sun
  const dayIdx = dow === 0 ? 6 : dow - 1; // Mon=0..Sun=6
  return { weekIdx, dayIdx, weekNum: weekIdx + 1 };
}

// ─── DAY TYPE ─────────────────────────────────────────────────────────────
// Mon/Wed/Fri = MMA, Tue/Thu = swim, Sat = sat, Sun = sun
function getDayType(dayIdx) {
  if ([0,2,4].includes(dayIdx)) return 'mma';
  if ([1,3].includes(dayIdx))   return 'swim';
  if (dayIdx === 5)              return 'sat';
  return 'sun';
}

function typeInfo(type) {
  const m = {

  return m[type];
}

  { id:'bed',       start:21, end:24 },
];

function getMealStatus(mealId, hourNow) {
  const w = MEAL_WINDOWS.find(m => m.id === mealId);
  if (!w) return 'upcoming';
  if (hourNow >= w.end)   return 'past';
  if (hourNow >= w.start) return 'current';
  return 'upcoming';
}

      timeHi: 'Uthte Waqt · 5-9 baje',
      dish: t('Jeera water + 1 Banana', 'Jeera pani + 1 Kela'),
      detail: t('Soak jeera overnight · drink warm on empty stomach · banana = pre-gym fuel',
                'Raat ko jeera pani mein bheego · subah khali pet garam karke piyo · kela = pre-gym fuel'),
      method: t('No cooking', 'Pakana nahi'),
      pro: '',
      high: false,
      bg: 'var(--greenL)', accent: '#1D9E75',
      currentBg: '#1D9E75',
    },
    {
      id: 'breakfast',
      emoji: '🍳',
      timeEn: 'Breakfast · 9am–1pm',
      timeHi: 'Nashta · 9 baje – dopahar 1 baje',
      dish: t(dayData.b.dish, dayData.b.dish_hi),
      detail: t(dayData.b.detail, dayData.b.detail_hi),
      method: t(dayData.b.method, dayData.b.method_hi),
      pro: dayData.b.pro,
      high: false,
      bg: 'var(--swimL)', accent: '#1A5276',
      currentBg: '#1A5276',
    },
    {
      id: 'lunch',
      emoji: '🍛',
      timeEn: 'Lunch · 1–5pm',
      timeHi: 'Dopahar ka Khana · 1-5 baje',
      dish: t(dayData.l.dish, dayData.l.dish_hi),
      detail: t(dayData.l.detail, dayData.l.detail_hi),
      method: t(dayData.l.method, dayData.l.method_hi),
      pro: dayData.l.pro,
      high: false,
      bg: 'var(--amberL)', accent: '#784212',
      currentBg: '#784212',
    },
    {
      id: 'snack',
      emoji: '🍌',
      timeEn: 'Pre-MMA Snack · 5–7pm',
      timeHi: 'Shaam ka Snack · 5-7 baje',
      dish: dayData.snack ? t(dayData.snack.dish, dayData.snack.dish_hi) : '',
      detail: dayData.snack ? t(dayData.snack.detail + ' · Eat before leaving for MMA',
                                dayData.snack.detail_hi + ' · MMA se pehle khana') : '',
      method: dayData.snack ? t(dayData.snack.method, dayData.snack.method_hi) : '',
      pro: dayData.snack ? dayData.snack.pro : '',
      high: false,
      bg: 'var(--redL)', accent: '#C0392B',
      currentBg: '#C0392B',
      skipIfNoSnack: !dayData.snack,
    },
    {
      id: 'dinner',
      emoji: '🌙',
      timeEn: 'Dinner · 7–11pm',
      timeHi: 'Raat ka Khana · 7-11 baje',
      dish: t(dayData.d.dish, dayData.d.dish_hi),
      detail: t(dayData.d.detail, dayData.d.detail_hi),
      method: t(dayData.d.method, dayData.d.method_hi),
      pro: dayData.d.pro,
      high: dayData.d.high,
      bg: 'var(--purpleL)', accent: '#3C3489',
      currentBg: '#3C3489',
    },
    {
      id: 'bed',
      emoji: '💤',
      timeEn: 'Before Sleep · 9pm+',
      timeHi: 'Sone se Pehle · 9 baje ke baad',
      dish: t('Isabgol + Haldi milk', 'Isabgol + Haldi wala doodh'),
      detail: t('Isabgol in water · warm milk + 1 tsp haldi + kali mirch · no sugar · every night',
                'Isabgol alag pani mein · doodh mein 1 chammach haldi + kali mirch · cheeni nahi · roz raat'),
      method: t('Every night without fail', 'Roz raat ko zaroori'),
      pro: '',
      high: false,
      bg: 'var(--greyL)', accent: '#444441',
      currentBg: '#444441',
    },
  ];

  let html = '';
  meals.forEach(m => {
    if (m.skipIfNoSnack) { return; } // hide snack card if no snack today

    const status = getMealStatus(m.id, hour);
    // bed card only shows as current after 9pm
    const effectiveStatus = (m.id === 'bed' && hour < 21) ? 'upcoming' : status;

    const badgeText = t('NOW', 'ABHI');
    const proColor = m.high ? 'var(--red)' : '#1D9E75';

    html += `
    <div class="meal-card ${effectiveStatus}" style="${effectiveStatus === 'current' ? `--current-color:${m.currentBg}` : ''}">
      ${effectiveStatus === 'current' ? `<div style="position:absolute;left:0;top:0;bottom:0;width:5px;background:${m.currentBg};border-radius:14px 0 0 14px;"></div>` : ''}
      <div class="meal-inner">
        <div class="meal-top">
          <div class="meal-emoji">${m.emoji}</div>
          <div>
            <div class="meal-time-label" style="color:${m.accent}">${t(m.timeEn, m.timeHi)}</div>
          </div>
          <span class="current-badge" style="background:${m.currentBg};color:#fff;">${badgeText}</span>
        </div>
        <div class="meal-dish">${m.dish}</div>
        <div class="meal-detail">${m.detail}</div>
      </div>
      ${(m.pro || m.method) ? `
      <div class="meal-footer">
        <div class="meal-method">${m.method}</div>
        ${m.pro ? `<div class="meal-protein" style="color:${proColor};">${m.pro}${m.high ? ' ★' : ''}</div>` : ''}
      </div>` : ''}
    </div>`;
  });

  document.getElementById('mealsArea').innerHTML = html;

  // Gut routine
  document.getElementById('gutHeader').textContent =
    t('🌿 Daily Gut Routine — Every Day', '🌿 Roz ka Gut Routine — Har Din');
  document.getElementById('gutBody').innerHTML = GUT.map(g =>
    `<div class="gut-item"><span class="gut-dot">•</span><span>${t(g.en, g.hi)}</span></div>`
  ).join('');

  document.getElementById('footer').textContent =
    t('4-week cycle · 3 months · 120–130g protein daily',
      '4 hafte ka cycle · 3 mahine · 120-130g protein roz');
}

// ─── AUTO REFRESH every 60 seconds ───────────────────────────────────────
render();
setInterval(render, 60000);
</script>
</body>
</html>
